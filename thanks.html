  <!-- LINEヤフー広告 計測タグ：グローバルスニペット -->
  <script async src="https://tag.flvcdn.net/lytag.js"></script>
  <script>
    window.lyDataLayer = window.lyDataLayer || [];
    function lytag() {
      window.lyDataLayer.push(Array.from(arguments));
    }
    lytag({
      type: 'init',
      tagId: 'd61a92ed-025a-44c5-b0a2-9af25277044d',
      config: {
        useCookie: true,
        useLocalStorage: true
      }
    });
  </script>

  <!--
    購入イベントは session_id が付いている場合だけ送信します。
    Stripeのリダイレクト先を次のURLにしてください：
    https://kando-sakaki.hitisou-yuen.com/thanks.html?session_id={CHECKOUT_SESSION_ID}
  -->
  <script>
    (function () {
      const url = new URL(window.location.href);
      const sessionId = url.searchParams.get('session_id');
      const looksLikeStripeSession = sessionId && sessionId.startsWith('cs_');

      if (!looksLikeStripeSession) return;

      const storageKey = 'ly_purchase_sent_' + sessionId;

      try {
        if (localStorage.getItem(storageKey) === '1') return;
      } catch (e) {
        // localStorageが使えない場合でも計測処理は続行
      }

      lytag({
        type: 'event',
        eventType: 'purchase',
        tagId: 'd61a92ed-025a-44c5-b0a2-9af25277044d'
      });

      try {
        localStorage.setItem(storageKey, '1');
      } catch (e) {}

      // 更新でpurchaseが再送されにくいよう、計測後にsession_idだけURLから外す
      url.searchParams.delete('session_id');
      history.replaceState(null, '', url.pathname + (url.search ? url.search : '') + url.hash);
    })();
  </script>

  <!--
